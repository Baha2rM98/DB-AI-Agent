services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: db-ai-agent-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-db_ai_agent}
      CHECKPOINTER_BACKEND: ${CHECKPOINTER_BACKEND:-postgres}
      CHECKPOINTER_DATABASE_URL: ${CHECKPOINTER_DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-db_ai_agent}}
      CHECKPOINTER_SQLITE_PATH: ${CHECKPOINTER_SQLITE_PATH:-/app/checkpoints.db}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-pro}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: db-ai-agent-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-db_ai_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-db_ai_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
